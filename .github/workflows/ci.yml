name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch MediaPipe runtime and model
        run: npm run setup:assets
      - run: npm run typecheck
      - run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (real WebGL2 engine via SwiftShader)
        run: npm run test:e2e
      - run: npm run build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
